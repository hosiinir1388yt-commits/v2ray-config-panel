<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2Ray Config Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock">
  <div class="card login">
    <h1>پنل ساخت کانفیگ V2Ray</h1>
    <p>رمز پنل را وارد کنید</p>
    <input id="pw" type="password" placeholder="رمز پنل">
    <button onclick="login()">ورود</button>
    <b id="err"></b>
  </div>
</div>

<main id="app" hidden>
<header>
  <div>
    <h1>V2Ray Config Panel</h1>
    <p>ساخت کانفیگ پایه VLESS، VMess، Trojan و Shadowsocks</p>
  </div>
  <button class="secondary" onclick="location.reload()">خروج</button>
</header>

<section class="grid">
<div class="card">
<h2>تنظیمات</h2>

<label>پروتکل
<select id="protocol">
<option>VLESS</option>
<option>VMess</option>
<option>Trojan</option>
<option>Shadowsocks</option>
</select>
</label>

<label>آدرس سرور
<input id="address" placeholder="example.com">
</label>

<div class="two">
<label>پورت<input id="port" type="number" value="443"></label>
<label>UUID / Password<input id="id" placeholder="UUID یا Password"></label>
</div>

<label>Transport
<select id="transport">
<option value="tcp">TCP</option>
<option value="ws">WebSocket</option>
<option value="grpc">gRPC</option>
</select>
</label>

<label>Path / Service Name
<input id="path" placeholder="/vless">
</label>

<label class="check">
<input id="tls" type="checkbox" checked> TLS فعال
</label>

<button onclick="generate()">ساخت کانفیگ</button>
</div>

<div class="card">
<h2>خروجی JSON</h2>
<textarea id="out" readonly></textarea>
<div class="actions">
<button onclick="copyOut()">کپی</button>
<button class="secondary" onclick="downloadOut()">دانلود JSON</button>
</div>
<p id="status"></p>
</div>
</section>

<footer>این ابزار فقط JSON کانفیگ را تولید می‌کند و به سرور V2Ray متصل نمی‌شود.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
